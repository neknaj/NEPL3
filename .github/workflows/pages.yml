name: Publish documentation

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nepl3-pages-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: doc-browser-${{ github.event.workflow_run.head_sha }}
          path: dist/checked
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Inspect the same payload that passed CI
        run: |
          IDENTITY=$(python tools/site/checked_artifact.py dist/checked "$SOURCE_COMMIT")
          echo "MANIFEST_SHA256=$IDENTITY" >> "$GITHUB_ENV"
      - name: Package checked file bytes using the official Pages transport
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/checked/site
          include-hidden-files: true
          retention-days: 14
      - name: Require current main immediately before publication
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$SOURCE_COMMIT"
      - name: Deploy checked documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public documentation bytes and basic routes
        run: |
          python tools/site/smoke.py dist/checked/site https://neknaj.github.io/NEPL3/ --manifest-sha256 "$MANIFEST_SHA256" > dist/public-smoke.json
      - name: Preserve public smoke result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pages-smoke-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/public-smoke.json
          if-no-files-found: warn
          retention-days: 14
