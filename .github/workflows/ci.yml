name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned toolchain and components
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          rustc --version --verbose
          cargo --version
      - name: Install structural audit interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Host file and process portability tests
        run: |
          python -m unittest discover -s tools/site -p test_transport.py
          python -m unittest discover -s tools/site -p test_payload.py
          python -m unittest discover -s tools/site -p test_smoke.py
          python -m unittest discover -s tools/site -p test_record_smoke.py
          python -m unittest tools.evidence.test_runner
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: External language public API consumer
        run: |
          python -m unittest tools.extensions.test_run
          python tools/extensions/run.py
      - name: Preserve external consumer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-consumer-${{ matrix.os }}
          path: dist/external-extension/
          if-no-files-found: error
          retention-days: 14
      - name: Export the real Doc example
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p dist
          cargo run --locked -p nepl3-tools -- doc-html export examples/document/linear-combination.nepld dist/doc-example
      - name: Generate the linked Doc migration candidate
        run: |
          mkdir -p dist
          cargo run --locked -p nepl3-tools -- doc-html pages doc/migration/pages.json dist/doc-migration
          cargo run --locked -p nepl3-tools -- doc-markdown doc/migration/00-contract.nepld dist/00-contract.view.md
      - name: Upload the Doc migration candidate
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NEPL3-doc-migration-${{ github.sha }}
          path: dist/doc-migration/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Markdown compatibility view
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NEPL3-doc-markdown-${{ github.sha }}
          path: dist/00-contract.view.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload generated local document
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NEPL3-local-doc-${{ github.sha }}
          path: dist/doc-example/
          if-no-files-found: error
          retention-days: 14
      - name: Independent native allocation regression
        run: python tools/audit/allocation/run.py
      - name: API documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Repository contracts
        run: cargo run --locked -p nepl3-tools -- check
      - name: Canonical Doc Markdown projections
        run: cargo run --locked -p nepl3-tools -- doc-canonical --check
      - name: Export canonical Doc pages
        run: cargo run --locked -p nepl3-tools -- doc-canonical html dist/doc-canonical
      - name: Preserve canonical Doc snapshot
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NEPL3-canonical-doc-${{ github.sha }}
          path: dist/doc-canonical/
          if-no-files-found: error
          retention-days: 14
      - name: Verify clean tracked files
        run: git diff --exit-code

  repository-contract:
    name: repository and generated contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Independent structure audit
        run: python tools/audit/structure.py
      - name: Structure audit tests
        run: python -m unittest discover -s tools/audit -p test.py
      - name: Grammar constructor projection
        run: python tools/generate/grammar.py
      - name: Doc typed adapter projection
        run: python tools/generate/doc.py
      - name: Doc signature reference projection
        run: |
          python tools/generate/signatures.py
          python -m unittest tools.generate.test_signatures
      - name: Check Math schema generation
        run: python tools/generate/math.py
      - name: Check Markup schema generation
        run: python tools/generate/markup.py
      - name: Check Doc HTML schema generation
        run: python tools/generate/doc_html.py
      - name: Doc browser corpus audit input tests
        run: python -m unittest discover -s tools/audit/doc_html -p 'test_*.py'
      - name: Doc migration candidate and rejection tests
        run: |
          python tools/migration/contract.py
          python -m unittest discover -s tools/migration -p test_contract.py
      - name: Initial seed input adapter tests
        run: python -m unittest discover -s tools/bootstrap -p test_grammar.py
      - name: Generated tasks
        run: cargo run --locked -p nepl3-tools -- tasks --check
      - name: Check repository contracts
        run: cargo run --locked -p nepl3-tools -- check
      - name: Verify generated source is unchanged
        run: git diff --exit-code

  site-publication:
    name: site publication host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Collect publication unit and boundary results
        run: python -m tools.evidence.runner run tools/evidence/specs/site-tests.json dist/site-tests
      - name: Preserve raw results (not a publication proof)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-host-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/site-tests/
          if-no-files-found: error
          retention-days: 14

  wasi:
    name: wasi and wasm compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust targets
        run: |
          rustup show active-toolchain
          rustup target add wasm32-wasip2 wasm32-unknown-unknown
          rustc --version --verbose
      - name: Install verified Wasmtime
        run: |
          curl --fail --location --retry 3 --output wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v44.0.1/wasmtime-v44.0.1-x86_64-linux.tar.xz
          echo 'afd58715f105e3a7f454169daed22168c5736ec5f225fb04c4ac62c54c9508a3  wasmtime.tar.xz' | sha256sum --check --strict
          tar -xf wasmtime.tar.xz
          echo "$PWD/wasmtime-v44.0.1-x86_64-linux" >> "$GITHUB_PATH"
      - name: Execute foundation tests on WASI
        env:
          CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime run
        run: |
          wasmtime --version
          cargo test --locked -p nepl3-core -p nepl3-reader -p nepl3-wire -p nepl3-engine -p nepl3-grammar-core -p nepl3-doc-core -p nepl3-math-core -p nepl3-markup -p nepl3-doc-html --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar diagnostic::compiler_report_boundary_without_host_process --target wasm32-wasip2 -- --exact --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar reader::all_reader_constructors --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar reader::compiled_reader_streaming_boundaries_and_rollback_keep_raw_positions --target wasm32-wasip2 -- --exact --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar binding:: --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar region:: --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test doc --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test doc_capacity --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test math --target wasm32-wasip2 -- --test-threads=1
      - name: Compile foundation for browser Wasm
        run: cargo check --locked -p nepl3-core -p nepl3-reader -p nepl3-wire -p nepl3-engine -p nepl3-grammar-core -p nepl3-doc-core -p nepl3-math-core -p nepl3-markup -p nepl3-doc-html --no-default-features --target wasm32-unknown-unknown
      - name: Compare identical foundation components with Pulley64
        env:
          CARGO_TARGET_WASM32_WASIP2_RUNNER: python ${{ github.workspace }}/tools/emulators/wasmtime/compare.py
          NEPL3_WASM_EVIDENCE: ${{ github.workspace }}/target/pulley-evidence
        run: |
          python -m unittest discover -s tools/emulators/wasmtime -p 'test_*.py'
          python tools/emulators/wasmtime/compare.py --begin
          cargo test --locked --release -p nepl3-core -p nepl3-reader -p nepl3-wire -p nepl3-engine --target wasm32-wasip2 -- --test-threads=1
          python tools/emulators/wasmtime/compare.py --check-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: pulley-execution-${{ github.sha }}
          path: target/pulley-evidence/
          if-no-files-found: error
          retention-days: 14

  baremetal-build:
    name: baremetal ARMv6-M build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install ARMv6-M target
        run: rustup target add thumbv6m-none-eabi
      - name: Compile every implemented portable core for ARMv6-M
        run: cargo check --locked -p nepl3-core -p nepl3-reader -p nepl3-wire -p nepl3-engine -p nepl3-grammar-core -p nepl3-doc-core -p nepl3-math-core -p nepl3-markup -p nepl3-doc-html --no-default-features --target thumbv6m-none-eabi
      - name: Validate converter and firmware formatting
        run: |
          python -m unittest discover -s tools/emulators/rp2040js -p 'test_*.py'
          cargo fmt --manifest-path conformance/targets/rp2040/Cargo.toml -- --check
      - name: Build production foundation firmware and record identity
        run: python tools/emulators/rp2040js/firmware.py build conformance/targets/rp2040/target/bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rp2040-firmware-${{ github.sha }}
          path: conformance/targets/rp2040/target/bundle/
          if-no-files-found: error
          retention-days: 14

  baremetal-rp2040:
    name: baremetal RP2040 emulator execution
    needs: [baremetal-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: tools/emulators/rp2040js/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rp2040-firmware-${{ github.sha }}
          path: conformance/targets/rp2040/target/bundle/
      - name: Install pinned emulator and verify protocol rejection
        working-directory: tools/emulators/rp2040js
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Execute the build job's exact UF2 with an outer deadline
        run: python tools/emulators/rp2040js/firmware.py execute conformance/targets/rp2040/target/bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: rp2040-execution-${{ github.sha }}
          path: conformance/targets/rp2040/target/bundle/
          if-no-files-found: error
          retention-days: 14

  doc-browser:
    name: Doc HTML browser layout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned browser automation and matching engines
        run: |
          python -m pip install -r tools/audit/doc_html/requirements.txt
          python -m playwright install --with-deps chromium firefox webkit
      - name: Generate actual Doc output corpus
        run: |
          mkdir -p dist/doc-browser
          rustc --version --verbose > dist/doc-browser/rustc.txt
          git rev-parse HEAD > dist/doc-browser/commit.txt
          cargo test --locked -p nepl3-tools --test doc html::browser_layout_corpus_from_real_doc_source -- --exact --nocapture > dist/doc-browser/corpus.log 2> dist/doc-browser/corpus.stderr
      - name: Check scriptless document layout in three real browsers
        run: python tools/audit/doc_html/browser.py --corpus dist/doc-browser/corpus.log --css crates/languages/doc/html/assets/doc.css --output dist/doc-browser/results.json
      - name: Build canonical Doc site at both project paths
        run: |
          cargo run --locked -p nepl3-tools -- site build site/config.json dist/doc-browser/site
          cargo run --locked -p nepl3-tools -- site build conformance/inputs/site/alternate.json dist/doc-browser/site-alternate
      - name: Verify site identities, links and scriptless pages in three browsers
        run: |
          python -m unittest discover -s tools/audit/site -p 'test_*.py'
          python tools/audit/site/check.py dist/doc-browser/site dist/doc-browser/site-results.json --renderer target/debug/nepl3-tools
          python tools/audit/site/check.py dist/doc-browser/site-alternate dist/doc-browser/site-alternate-results.json --config conformance/inputs/site/alternate.json --renderer target/debug/nepl3-tools
      - name: Freeze the checked site as a deterministic Pages payload
        run: |
          SITE_MANIFEST=$(python -c 'import json; print(json.load(open("dist/doc-browser/site-results.json"))["manifest_sha256"])')
          python tools/site/payload.py dist/doc-browser/site dist/doc-browser/pages.tar --manifest-sha256 "$SITE_MANIFEST" > dist/doc-browser/pages-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: doc-browser-${{ github.sha }}
          path: dist/doc-browser/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  quality:
    name: quality
    if: ${{ always() }}
    needs: [native, repository-contract, site-publication, wasi, baremetal-build, baremetal-rp2040, doc-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require native and WASI checks to pass
        env:
          REPOSITORY_RESULT: ${{ needs.repository-contract.result }}
          SITE_RESULT: ${{ needs.site-publication.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          WASI_RESULT: ${{ needs.wasi.result }}
          ARM_BUILD_RESULT: ${{ needs.baremetal-build.result }}
          RP2040_RESULT: ${{ needs.baremetal-rp2040.result }}
          DOC_BROWSER_RESULT: ${{ needs.doc-browser.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$SITE_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$WASI_RESULT" = success
          test "$ARM_BUILD_RESULT" = success
          test "$RP2040_RESULT" = success
          test "$DOC_BROWSER_RESULT" = success

  deliver-source:
    name: deliver source
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive tested source and record identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p dist
          git archive --format=tar.gz --prefix=NEPL3/ --output=dist/NEPL3-source.tar.gz "$GITHUB_SHA"
          cd dist
          sha256sum NEPL3-source.tar.gz > SHA256SUMS
          printf 'repository=%s\ncommit=%s\nworkflow_run=%s\nkind=source-foundation\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > SOURCE.txt
      - name: Upload source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NEPL3-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
