name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings

defaults:
  run:
    shell: bash

jobs:
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned toolchain and components
        run: |
          rustup show active-toolchain
          rustup component add rustfmt clippy
          rustc --version --verbose
          cargo --version
      - name: Install structural audit interpreter
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Independent structure audit
        run: python tools/audit/structure.py
      - name: Structure audit tests
        run: python -m unittest discover -s tools/audit -p test.py
      - name: Grammar constructor projection
        run: python tools/generate/grammar.py
      - name: Doc typed adapter projection
        run: python tools/generate/doc.py
      - name: Initial seed input adapter tests
        run: python -m unittest discover -s tools/bootstrap -p test_grammar.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Independent native allocation regression
        run: python tools/audit/allocation/run.py
      - name: API documentation
        run: cargo doc --workspace --no-deps --locked
      - name: Repository contracts
        run: cargo run --locked -p nepl3-tools -- check
      - name: Generated tasks
        run: cargo run --locked -p nepl3-tools -- tasks --check
      - name: Verify clean tracked files
        run: git diff --exit-code

  wasi:
    name: wasi and wasm compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust targets
        run: |
          rustup show active-toolchain
          rustup target add wasm32-wasip2 wasm32-unknown-unknown
          rustc --version --verbose
      - name: Install verified Wasmtime
        run: |
          curl --fail --location --retry 3 --output wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v44.0.1/wasmtime-v44.0.1-x86_64-linux.tar.xz
          echo 'afd58715f105e3a7f454169daed22168c5736ec5f225fb04c4ac62c54c9508a3  wasmtime.tar.xz' | sha256sum --check --strict
          tar -xf wasmtime.tar.xz
          echo "$PWD/wasmtime-v44.0.1-x86_64-linux" >> "$GITHUB_PATH"
      - name: Execute foundation tests on WASI
        env:
          CARGO_TARGET_WASM32_WASIP2_RUNNER: wasmtime run
        run: |
          wasmtime --version
          cargo test --locked -p nepl3-core -p nepl3-reader -p nepl3-wire -p nepl3-engine -p nepl3-grammar-core -p nepl3-doc-core --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar diagnostic::compiler_report_boundary_without_host_process --target wasm32-wasip2 -- --exact --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar reader::all_reader_constructors --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar reader::compiled_reader_streaming_boundaries_and_rollback_keep_raw_positions --target wasm32-wasip2 -- --exact --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar binding:: --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test grammar region:: --target wasm32-wasip2 -- --test-threads=1
          cargo test --locked -p nepl3-tools --test doc --target wasm32-wasip2 -- --test-threads=1
      - name: Compile foundation for browser Wasm
        run: cargo check --locked -p nepl3-core -p nepl3-reader -p nepl3-wire -p nepl3-engine -p nepl3-grammar-core -p nepl3-doc-core --no-default-features --target wasm32-unknown-unknown

  quality:
    name: quality
    if: ${{ always() }}
    needs: [native, wasi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require native and WASI checks to pass
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          WASI_RESULT: ${{ needs.wasi.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$WASI_RESULT" = success

  deliver-source:
    name: deliver source
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Archive tested source and record identity
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p dist
          git archive --format=tar.gz --prefix=NEPL3/ --output=dist/NEPL3-source.tar.gz "$GITHUB_SHA"
          cd dist
          sha256sum NEPL3-source.tar.gz > SHA256SUMS
          printf 'repository=%s\ncommit=%s\nworkflow_run=%s\nkind=source-foundation\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" > SOURCE.txt
      - name: Upload source bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NEPL3-source-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
