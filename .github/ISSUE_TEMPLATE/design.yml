name: 設計の訂正・提案
description: 契約の矛盾や新しい設計判断を検討する
body:
  - type: textarea
    id: problem
    attributes:
      label: 問題と根拠
      description: 対象仕様、具体例、公式資料など
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案と影響範囲
      description: schema・文法・依存・例・受入条件に必要な変更
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 検証方法
      description: 成功条件、失敗系、境界系と未確定事項
    validations:
      required: true
